# Routine template — copy to routines/<your-id>.yaml and edit.
# Files starting with "_" are ignored by the daemon.
# After editing: ./daemon.py validate && ./daemon.py run --routine <your-id> --dry-run

# Unique identifier. Defaults to the filename stem if omitted. Used in logs,
# in note frontmatter (rule_id), and as the --routine argument.
id: my-routine

# Set false to keep the file around without running it.
enabled: true

# Shown by `daemon.py list`.
description: One line about what this routine scoops.

# Optional semantic role shown by `memory-daemon-status.sh`. Declare intent
# explicitly; source count alone cannot distinguish a domain from a utility.
role: specialized

# Optional cadence for `daemon.py tick`. The template chooses 4h explicitly;
# omitting this block preserves the legacy 1h scheduler cadence. Manual `run`
# ignores it.
schedule:
  every: 4h
  # Optional faster cadence inside a local work window. Outside it, `every`
  # remains in force. Same-day windows only; use IANA timezone names.
  # work_hours:
  #   every: 15m
  #   days: [mon, tue, wed, thu, fri]
  #   start: "08:00"
  #   end: "18:00"
  #   timezone: Europe/London

# Optional ownership controls. Specific routines beat `fallback: true`; lower
# priority wins between routines in the same class. Equal priority is an error.
# routing:
#   priority: 100
#   fallback: false

# Use `source:` for one transport. A domain routine can instead use `sources:`
# with a list of Gmail / Drive / Slack / Google Chat blocks. In that form,
# Gmail actions live inside the Gmail source block. See
# `_example-domain-routine.yaml`.
source:
  # 'gmail' (Gmail search) or 'drive_docs' (Drive file search).
  kind: gmail

  # Any Gmail search query. Quote it so YAML keeps the inner quotes.
  # Items already in state/processed.json are skipped, so a broad query is safe
  # from re-processing — but note it is NOT safe from *first*-processing: an
  # unscoped query summarizes everything it matches on the first run. Scope with
  # in:inbox, is:unread, or newer_than: unless you actually want the backfill.
  query: 'from:someone@example.com subject:"Weekly Report" (is:unread OR is:starred)'

  # Cap on items examined per run. Optional, default 20.
  max_results: 20

  # OPTIONAL — replace the email body with a linked Google Doc's tabs.
  # For notification emails that are only a stub (Gemini meeting notes are the
  # motivating case: the mail holds one tab and the doc link exists solely in
  # the HTML part, which gws strips). The doc is located by title instead.
  #
  # expand:
  #   kind: drive_doc
  #   # Regex over the subject. MUST have a named (?P<title>...) group; that
  #   # capture is what gets matched against Drive document names.
  #   # Prefer a greedy .+ over .+? — a non-greedy capture stops at the first
  #   # apostrophe, so "Notes: 'Omri's weekly'" would capture just "Omri".
  #   title_from_subject: "Notes: '(?P<title>.+)'"
  #   # Extra name filter. A doc is accepted only if its name STARTS WITH the
  #   # captured title at a title boundary; Drive search also matches bodies,
  #   # and near-miss names like "Roadmap review extended" must not win.
  #   name_contains: Notes by Gemini
  #   # Tabs to concatenate, in doc order. Missing tabs are skipped, not fatal;
  #   # frontmatter doc_tabs records which ones were actually read.
  #   tabs: [Full notes, Transcript]
  #   # 'body' (default) summarizes the email stub when no doc is found. That is
  #   # a big quality drop, so it is marked `expanded: false` in the note, gets
  #   # an expand_fallback entry in state, and is counted in the run summary.
  #   # 'error' instead skips the item, leaving it queued for a later retry.
  #   on_missing: body

analyze:
  # yoetz provider/model. Gemini resolves natively in yoetz's registry; OpenAI does not.
  provider: gemini
  model: gemini/gemini-3.1-pro-preview

  # Optional, default 4096. Do NOT drop below ~2048: reasoning tokens eat the
  # budget before visible output and the summary truncates mid-sentence.
  max_output_tokens: 4096

  # Optional. When true the full user-label catalog is passed to the model and it
  # returns one `LABEL: <name>` line. The name is validated against the real
  # catalog before Gmail ever sees it. Required by the apply_label action.
  pick_label: true

  # Optional. Injected into the prompt and recorded in the note frontmatter.
  focus_domains:
    - Domain A
    - Domain B

  # The actual analysis brief. Be specific about structure and scope. Domain
  # routines should name adjacent domains they do not own, tell the model how
  # to handle mixed items, and use the exact NOT MEMORY-WORTHY rejection token.
  instruction: >-
    Summarize this email for a product leader. Use short bullet points.
    Do not editorialize beyond what the email states.

output:
  # Absolute path. Created if missing. Point it at whatever folder your vault
  # treats as an inbox so the notes surface in your normal triage flow.
  vault_dir: /absolute/path/to/your/vault/inbox

  # Filename becomes <slug_prefix>-<date>.md by default, suffixed with a short
  # item id if that file already exists.
  slug_prefix: my-routine-summary

  # OPTIONAL filename template. Placeholders: {slug_prefix} {date} {title} {id}.
  # If a routine can match several items with the same date — several meetings
  # in one day, say — put {title} in here or they all collide onto one stem.
  # filename_template: "{slug_prefix}-{date}-{title}"

  # Optional frontmatter overrides.
  # kind: email-scoop-summary
  # tags: [kind/email-scoop-summary, status/inbox]

# Gmail triage applied after the note is written, in order.
# Valid: apply_label, mark_read, mark_unread, star, unstar, archive
# A failing action does not abort the others: it is recorded as pending and
# retried at the start of the next run. Use [] to leave the mailbox untouched.
actions: [apply_label, mark_read, unstar, archive]

# OPTIONAL — a fixed Gmail label for every item, instead of letting the model
# choose one. Mutually exclusive with analyze.pick_label. Still validated
# against the live catalog, so a typo fails loudly rather than creating a label.
# label: SOME EXISTING LABEL

# OPTIONAL — when one routine covers several recurring report streams that
# differ only in what they should be called and where they are filed. Keys match
# against the SUBJECT (the stable identity of a recurring report: a colleague
# replying into the thread does not change it, where the sender would). Prefix a
# key with `from:` to match the sender instead.
#
#   title  gives the stream a stable name for the note and its filename —
#          better than the raw subject, which carries RE:/FW: and its own
#          embedded date. Pair it with filename_template "{title}-{date}".
#   label  the Gmail label for this stream, validated like `label` above.
#   message_updates
#          set true only when every reply in a deliberately reused thread is a
#          fresh report. Quoted history is removed, reply dates come from the
#          message header, and memory dedupes per message instead of per thread.
#
# These are deterministic stream rules, so declare them here rather than
# leaving naming, filing, or thread semantics to the model.
# streams:
#   "Weekly Report DACH TEAM":
#     title: Weekly - DACH
#     label: EMEA
#   "Channel Business weekly report":
#     title: Weekly - Channel Business
#     label: CHANNELS
#     message_updates: true
