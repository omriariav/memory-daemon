# Example: refresh the metadata-only active Slack conversation inventory.
#
# This routine makes no LLM call and reads no message content beyond Slack's
# one-message activity probe. A separate Slack content routine consumes the
# completed checkpoint with active_conversations.refresh_if_stale: false.
id: example-slack-census
enabled: false
description: Refresh the active Slack conversation inventory once a day.
role: maintenance

schedule:
  every: 1d

maintenance:
  kind: slack_conversation_census
  checkpoint: state/slack-census.json
  hours: 48
  requests_per_minute: 40
