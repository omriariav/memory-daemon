# Read-only Mila transcription ingestion. Mila's directory is a live app store:
# never move/edit its sidecars or recordings.json from the daemon.
id: meeting-transcriptions
enabled: false
description: Match completed Mila recordings to Calendar and retain durable meeting memory.
role: specialized

schedule:
  every: 1h

source:
  kind: mila
  recordings_file: /absolute/path/to/mila-recordings/recordings.json
  max_results: 0

  # Seed already-existing recordings here when enabling the routine against an
  # established Mila library. New UUIDs remain discoverable regardless of how
  # many days later an iOS Voice Memo is imported.
  exclude_recording_ids:
    - EXISTING-RECORDING-UUID

  # Optional repair/backfill for a transcript copied or renamed outside Mila.
  # Metadata still comes from a Mila index; the daemon does not guess dates or
  # hand-edit either index.
  manual_recordings:
    - recording_id: LEGACY-RECORDING-UUID
      recordings_file: /absolute/path/to/old-mila-store/recordings.json
      transcript_file: /absolute/path/to/copied-meeting.srt
      fallback_file: /absolute/path/to/copied-meeting.txt

  calendar_timezone: Europe/London
  calendar_window_days: 3
  calendar_match_hours: 6
  max_calendar_candidates: 8
  calendar_max_results: 250
  # Upper bound on transcript characters sent to analysis (head and tail are
  # kept). Counts characters, so it is script-agnostic (Hebrew, etc.).
  max_transcript_chars: 60000

  # Calendar candidates through the connector (read-only list tool, one pinned
  # call per recording window, cached for the run) instead of the default
  # `provider: gws`, which needs its own Google OAuth.
  calendar:
    provider: connector
    list_tool: mcp__claude_ai_Example_Calendar__list_events
    calendar_id: primary
    owner_email: me@example.com

  # Recording-app hints: the app's action items and summary are appended to the
  # transcript as an unverified hints block (the transcript stays the input).
  # Hints failing a local transcript-overlap check are dropped. A recording with
  # no hints yet is held up to wait_minutes, then processed transcript-only.
  app_summary:
    mode: hints            # off (default) | hints
    wait_minutes: 45
    min_chars: 200
    min_overlap: 0.3
    item_min_overlap: 0.25

  # On-device matching: deterministic title + time rules first, then a local
  # Ollama model only for ambiguous recordings, so raw transcripts never reach
  # a cloud model for matching. Ollama down means "unmatched, retry next run".
  match:
    provider: ollama
    model: qwen2.5:7b-instruct
    base_url: http://localhost:11434

analyze:
  provider: claude          # headless Claude bridge; summaries only, no tools
  model: sonnet
  max_output_tokens: 4096
  instruction: >-
    The source is a meeting transcript and may not be in English. Write the
    memory in English. Preserve only durable decisions, commitments, action
    items, deadlines, blockers, material findings, and people/project facts.
    Attribute an owner or deadline only when stated. Use Calendar metadata only
    to identify the meeting and its participants; never infer discussion
    content from the invitation. Ignore small talk and transcription noise.
    Return exactly NOT MEMORY-WORTHY when nothing durable was discussed.

memory:
  store: /absolute/path/to/private-memory
  type: note
  tags: [meeting, transcription, mila]
  # Optional: also file the owner's own action items as separate `todo`
  # entries (ids `<source id>#action-<hash>`), so the Fibery export sees them.
  owner_todos:
    enabled: false
    max_per_item: 5
    tag: from-meeting
    owner_slug: me-example
    owner_name: Me Example   # required; fail closed without it
  # Optional: a short brief for each person met for the first time (display
  # name and email domain only here; see "Person briefs" in the README).
  person_briefs:
    enabled: false
    sources: [mila]
