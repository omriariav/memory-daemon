# A fallback may match broad source inboxes, but it loses ownership whenever a
# specific routine also matches the same source item.
id: periodic-inbox-sweep
enabled: true
description: Low-frequency memory sweep for otherwise-unowned work updates.

schedule:
  every: 1d

routing:
  fallback: true

sources:
  - kind: gmail
    query: '{in:inbox in:sent}'
    queue_query: 'in:inbox {is:unread is:starred}'
    max_results: 0
    catch_up: true
    catch_up_overlap: 1h
    catch_up_after: "2026-08-01T00:00:00Z"
    actions: []

  - kind: slack
    include_mentions: true
    hours: 26
    max_results: 50

  - kind: gchat
    all_spaces: true
    hours: 26
    max_results: 0        # all messages across active spaces
    max_per_space: 0      # all messages inside each active space
    batch_messages: daily # stable space/day digest, updated as replies arrive
    session_gap_minutes: 120 # separate unrelated conversation bursts
    catch_up: true         # durable last-successful cursor; no fixed loss window
    catch_up_overlap: 1h   # source reads repeat safely; ledger skips seen versions

analyze:
  provider: gemini
  model: gemini/gemini-3.1-pro-preview
  max_output_tokens: 4096
  instruction: >-
    Keep only durable decisions, commitments, incidents, feedback, and people
    or project facts worth recalling later. Discard logistics, notifications,
    chatter, and pure status without a new fact.

memory:
  store: /absolute/path/to/personal-memory
  type: note
  tags: [periodic-sweep]
