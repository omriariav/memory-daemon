# Example: sweep Slack channels + @mentions into a personal-memory store.
#
# Requires:
#   - the built-in read-only Slack client configured at
#     ~/.config/memory-daemon/slack.json
#   - a personal-memory instance (github.com/vladimanaev/personal-memory)
#
# A `memory:` block can be added to ANY routine (gmail/drive ones too); the
# `output:` vault block becomes optional once a memory block exists. The sink
# runs a structured second LLM pass over the summary, validates the returned
# type and person slugs against the store, and writes via the store's own CLI
# so dedup/index/versioning all apply. Every entry is tagged `auto-captured`.
id: example-slack-to-memory
enabled: false
description: Distill watched Slack channels and mentions into memory entries.

source:
  kind: slack
  # To sweep every recently active joined channel/DM instead of maintaining an
  # allowlist, replace direct_channels/include_mentions with this census cache.
  # Use the separate _example-slack-census.yaml maintenance routine to refresh
  # it daily; this content routine then consumes the cache without hiding a
  # long metadata scan inside a frequent sweep.
  # active_conversations:
  #   checkpoint: state/slack-census.json
  #   hours: 48
  #   refresh_every: 1d
  #   requests_per_minute: 40
  #   refresh_if_stale: false
  direct_channels:       # raw history; works for known public/private IDs
    - C0123ABCD          # #my-team-channel
    - C0456EFGH          # #my-project-channel (private channels work too)
  include_mentions: true # workspace-wide @mentions of you
  hours: 26              # bootstrap fallback before the first cursor
  max_results: 0         # uncapped direct reads are required for catch-up
  catch_up: true
  catch_up_overlap: 1h   # the ledger skips unchanged overlapping versions
  catch_up_after: "2026-07-28T08:00:00Z" # replace with your prior-run cutover
  reply_roots_after: "2026-06-28T08:00:00Z" # beginning of first-run coverage

analyze:
  provider: gemini
  model: gemini/gemini-3.1-pro-preview
  max_output_tokens: 4096
  # Take the extraction prompt from the store's connector body — the same file
  # the web UI's connector editor writes, so tuning capture is a browser edit
  # and interactive agent sessions apply identical judgment. Requires
  # memory.store below. Use an inline `instruction:` instead when the routine
  # is a specialized job rather than a general sweep of the source.
  instruction_from_connector: slack
  # Explicitly publish health for this connector's configured coverage. Other
  # enabled Slack routine scopes hold the safe watermark until they succeed.
  connector_sweep: true
  # Optional: stream-specific guidance appended to the connector body.
  instruction_extra: >-
    This sweep covers the team's project channels. Treat rollout steps and
    config changes as high value even when they look routine.

memory:
  store: /absolute/path/to/your/personal-memory
  type: note             # fallback entry type; the extraction pass may refine it
  tags: [slack]
