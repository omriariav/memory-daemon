# Copy to inbox.yaml (gitignored) and edit. Every key is optional; with no
# file at all the inbox shows the built-in events source with these defaults.
# Run: python daemon.py inbox          (needs: pip install 'textual>=8.2,<9')
#      python daemon.py inbox --demo   (invented data, reads and writes nothing)

# Sources are refreshed when their files change: every watch_interval_s the
# files each source depends on are stat-checked and only a source whose file
# changed is re-run. poll_interval_s is the fallback full refresh (the r key
# refreshes everything at once). See docs/inbox.md.
poll_interval_s: 600       # 30 to 3600
watch_interval_s: 3        # 1 to 30
theme: dark                # dark | light   (ctrl+t flips it at runtime)

# Hebrew / RTL display. logical = pass text through (the terminal does bidi),
# visual = reorder with python-bidi (the terminal does not), auto = pick by
# $TERM_PROGRAM (iTerm2 -> logical, anything unknown -> visual).
# $INBOX_BIDI overrides this; the `b` key toggles at runtime.
bidi_mode: auto

# Gmail links open /mail/u/<N>/: set N to your account's position when it is
# not the first one signed in to your browser.
gmail_account: 0
# Other people's RSVP answers to your invites ("RSVP" calendar rows) are
# hidden; true lists them (see docs/inbox.md).
show_rsvp_replies: false

# Daemon alerts are urgent only while they are relevant. An alert older than
# this many hours drops to the FYI section (1 to 168). An alert the daemon no
# longer lists as active (its key left state/alerts.json) is resolved: hidden,
# and shown under FYI when you press R. Only the newest alert per key is
# listed. Details in docs/inbox.md.
alert_urgent_max_age_h: 6

# RSVP on pending invites (a accept, X decline, T tentative). Off until set;
# there is no default. One headless Claude call through the daemon's bridge
# whose ONLY allowed tool is the one below, with exactly three arguments, pinned
# to the event id, the calendar id and the answer (accepted | declined |
# tentative): any other argument is denied.
# `args` maps those three values to YOUR tool's parameter names. Tool names
# here are placeholders: use the name Claude Code lists for your calendar
# connector. The bridge's pause file and daily budget apply. See docs/inbox.md.
# rsvp:
#   tool: "mcp__calendar_connector__respond_to_event"
#   args:
#     event_id: "event_id"
#     calendar_id: "calendar_id"
#     response: "response"
#   timeout_s: 60            # 30 to 300 (the bridge waits ~6 s for connectors)
#   # model: haiku

# Save to memory (m key, any item). Off until set; there is no default. The
# command gets {"v": 1, "action": "save", "item": {...}} on stdin (never in
# argv) and prints {"ok": true, "message": "...", "memory_id": "...",
# "duplicate": false}. See "Save protocol" in docs/inbox.md.
# A successful save (also "already in memory") marks the item done, like d,
# with the 5 s undo; mark_done: false keeps the row instead.
# save:
#   argv: ["python3", "~/bin/my-inbox-save.py"]
#   timeout_s: 30            # 5 to 120; on a timeout: SIGTERM, then SIGKILL after 5 s
#   mark_done: true

# Context pane (c key). Off until set; there is no default. While the pane is
# open, selecting an item runs this command (after a ~400 ms pause, in the
# background) and shows the sections it returns; results are cached for 10
# minutes per item. The command gets {"v": 1, "action": "context", "item":
# {...}} on stdin (never in argv) and prints ONE JSON line: {"v": 1, "ok":
# true, "sections": [{"title": "Person", "lines": ["Role: ..."]}], "message":
# null}. It MUST be read-only (it runs on its own, on every selection) and
# must exit within timeout_s or, on SIGTERM, stop and wait for its children.
# At most 6 sections, 40 lines each, 300 characters a line. See "Context
# protocol" in docs/inbox.md.
# context:
#   argv: ["python3", "~/bin/my-inbox-context.py"]
#   timeout_s: 20            # 2 to 60; on a timeout: SIGTERM, then SIGKILL after 5 s

# AI summary on demand (i key; I asks again). Off until set; there is no
# default. One headless Claude call through the daemon's bridge with NO tools
# at all (text only), over the item, its thread and the loaded context. The
# bridge's pause file and daily budget apply; spend is logged as
# inbox-summary. Results are cached on disk (state/inbox-summary/cache.json,
# 200 entries). `summary: {}` turns it on with the defaults below.
# summary:
#   model: haiku             # the model of the one-call run
#   timeout_s: 90            # 30 to 300
#   max_budget_usd: 0.05     # 0.005 to 2: the per-call spend limit

# Slack send for replies and nudges (a approves a reply, n sends a nudge). Off
# until set; there is no default. Without it a reply or nudge works only in
# --demo and nothing is ever sent. One headless Claude call through the
# daemon's bridge whose ONLY allowed tool is the one below, called at most once.
# Its arguments are pinned to the destination and the exact text of the draft
# (after your edits; trailing whitespace removed; a text over 4000 characters or
# with control or bidi-override characters is refused, never cut): channel,
# text and, for a thread, thread_ts; any other argument is denied. The destination is the
# item's meta.reply_to ({channel, thread_ts?, message_ts?}, validated), never
# taken from item text; an item without one cannot be sent or drafted to (Copy
# for Slack still works: it needs no destination). The confirm
# modal shows the destination, its channel id and thread, and the full text,
# then the 5 s undo window
# opens (q inside it cancels); the run is never retried, and a timeout is
# reported as "may have been sent, check Slack". A sent item is marked done.
# `args` maps the three values to YOUR tool's parameter names. Tool names here
# are placeholders. The bridge's pause file and daily budget apply. See
# "Slack send" in docs/inbox.md.
#
# 0.7.0: "send" is a choice. Some workplaces block headless Slack SENDS with a
# managed security hook while a draft tool still works, so after you pick a/n
# the confirm screen offers up to three actions: "Draft in Slack" (d: puts the
# text in the conversation's Slack draft box, nothing is sent, the item stays;
# needs mode draft or both), "Send" (y; needs mode send or both) and "Copy for
# Slack" (c: converts the markdown to Slack mrkdwn on your clipboard, no tool
# call; always offered once send: or copy: is set). mode defaults to "send", the
# 0.6.0 behaviour. draft_tool takes the same `args` mapping as `tool`. See
# "Draft and copy" in docs/inbox.md.
# send:
#   mode: both               # send (default) | draft | both
#   tool: "mcp__slack_connector__send_message"          # not needed in mode draft
#   draft_tool: "mcp__slack_connector__send_message_draft"   # needed in draft and both
#   args:
#     channel: "channel_id"
#     thread_ts: "thread_ts"
#     text: "text"
#   timeout_s: 90            # 30 to 300
#   # model: haiku
#   # A reply to a channel or group WITHOUT a thread would be a top-level post:
#   # refused unless this is true (a DM needs no thread; nudges follow it too).
#   allow_channel_posts: false
#   # Optional read-only check right before the confirm modal: it gets
#   # {"v": 1, "action": "precheck", "item": {...}, "text": "..."} on stdin (never
#   # argv) and prints {"v": 1, "ok": true, "warn": "You already replied at 16:40"}.
#   # A warn is shown in the modal; a failure shows "couldn't check for a newer
#   # reply"; it never blocks the send.
#   precheck:
#     argv: ["python3", "~/bin/my-inbox-precheck.py"]
#     timeout_s: 10          # 1 to 30

# Copy for Slack without any send tool (a/n then offer only "Copy for Slack").
# Not needed when send: is set (copy is always on then).
# copy: true

# Where `o` opens a Slack item: the item's meta.reply_to plus these. `team` is
# your Slack workspace id (T followed by 6 to 12 capitals or digits); the
# template must start with slack:// or https:// and may use {channel},
# {thread_ts}, {message_ts} and {team}. With a thread, {thread_ts} opens the
# thread. Without this `o` opens the item's own link. After a Draft or a Copy
# you press o, then Enter or paste. Alternative web form:
#   https://app.slack.com/client/{team}/{channel}/thread/{channel}-{thread_ts}
# team: "T0EXAMPLE1"
# slack_open:
#   url_template: "slack://channel?team={team}&id={channel}"

# Slack reaction (E key). Off until set; there is no default. Pick an emoji
# (1-9 quick keys), confirm, 5 s undo, then one pinned call with exactly the
# channel, the message timestamp and the emoji name. The target is
# meta.reply_to.message_ts, else thread_ts; a valid meta.suggested_reaction is
# preselected when it is one of `emojis` (still confirmed). A successful
# reaction marks the item done (mark_done: false keeps it). See "Slack reactions" in docs/inbox.md.
# react:
#   tool: "mcp__slack_connector__add_reaction"
#   args:
#     channel: "channel_id"
#     timestamp: "timestamp"
#     name: "name"
#   emojis: ["eyes", "white_check_mark", "+1", "pray"]   # 1 to 9 names, no colons
#   timeout_s: 60            # 30 to 300
#   mark_done: true
#   allow_suggested: false   # true: a suggestion outside `emojis` is offered too
#   # model: haiku

# Polish the draft in your tone (P key). Off until set; there is no default.
# Never sends anything. Step 1: one read-only call of tone_tool with exactly
# tone_args, on the MCP servers of the JSON file mcp_config (mode 0600, yours,
# not a symlink; it is the only place these servers are loaded from); the text
# it returns is cached for cache_h hours in state/inbox-polish/tone.json.
# Step 2: a rewrite with NO tools; the draft and the last 10 thread messages
# are data. You then accept, edit or cancel. Spend is logged as inbox-polish.
# See "Polish a draft" in docs/inbox.md.
# polish:
#   mcp_config: "~/.config/inbox/polish-mcp.json"
#   tone_tool: "mcp__tone_connector__get_tone"
#   tone_args: {profile: "work-chat"}
#   model: sonnet
#   timeout_s: 120           # 30 to 300, for each of the two calls
#   max_budget_usd: 0.05     # 0.005 to 2, for each of the two calls
#   cache_h: 24              # 0 (no cache) to 720

sources:
  # Built-in: state/events.jsonl (plus the .1 rotation), read-only.
  - name: events
    type: events
    window_h: 48           # only events from the last N hours (1 to 720)
    # Calendar invites you have not answered, from the calendar cache (never
    # the network): shown under Needs reply when they start within N days.
    # 0 turns it off; the cache must cover the range (docs/inbox.md).
    invites_days: 7
    # How many days back the Saved view (S key) looks: what the daemon saved
    # to memory (1 to 30).
    saved_days: 2
    # Show only mail captured through a Gmail routine whose search query
    # requires this label (null = all mail). Checked at capture time, from the
    # routine's query; see "Mail label filter" in docs/inbox.md.
    email_require_label: null    # e.g. MY_LABEL
    # Rules that put an event in the Urgent section; an event matching any
    # rule is urgent. All keys inside one rule must match. Omit `urgent` for
    # the default (budget-hit:, connector:, attention: alerts).
    urgent:
      - {source: daemon, key_prefix: "budget-hit:"}
      - {source: daemon, key_prefix: "connector:"}
      - {source: daemon, key_prefix: "attention:"}
      - {source: gcal, kind: cancel, starts_within_h: 24}
      # - {source: gmail, title_regex: "(?i)\\burgent\\b"}
    # Rule keys: source, kind, key_prefix (alerts), title_regex, starts_within_h

  # Any program that prints item format v1 JSON for `<argv> list`
  # (see docs/inbox.md). argv is a list, never a shell string.
  # - name: mail
  #   type: command
  #   argv: ["python3", "~/bin/my-inbox-source.py"]
  #   timeout_s: 20        # 1 to 120
  #   # Re-run this source when one of these files changes (relative to the
  #   # base dir, or absolute / ~). No watch list: fallback timer and `r` only.
  #   watch: ["state/comms-inbox.jsonl"]
  #   supports_all: true   # `<argv> list --all` works: the A key uses it

# Custom actions: your own confirmed write, one key each. Off until set; no
# default. The command is called with JSON on stdin (never argv): choices
# (read-only, pick one), prepare (read-only, shows what will happen; may say
# duplicate), then, after the confirm and the 5 s undo window, run (once, never
# retried). The key must be one the inbox does not use: h l p t w x z or one
# of B D F H J K M N O Q U V W Z. A successful run marks the item done
# (mark_done: false keeps it). See "Actions protocol" in docs/inbox.md.
# actions:
#   - key: "p"
#     label: "Add to agenda"
#     argv: ["python3", "~/bin/my-inbox-action.py"]
#     timeout_s: 120         # 5 to 300 per call
#     mark_done: true
