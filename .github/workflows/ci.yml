name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no Python 3.9 build
    timeout-minutes: 15    # a hang fails fast instead of holding the runner
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the README claims; 3.12 is what most people will run.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the PR commit-range privacy scan needs history

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install pyyaml pyflakes

      - name: Lint
        # F821 (undefined name) is the whole reason this step exists: a plain
        # NameError once reached review with green CI, because dry-runs return
        # before the offending line and the unit tests never drove that path.
        run: >-
          python -m pyflakes daemon.py workspace_daemon/ tests/ tools/
          plugins/memory-daemon-manager/scripts/

      - name: Crash-safety tests
        # No gws or yoetz on the runner. The suite must not need them — if a
        # test ever shells out to a real binary, this is where it breaks.
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          python daemon.py --help > /dev/null
          python daemon.py validate
          python daemon.py list

      - name: Validate the shipped template and examples
        # routines/*.yaml is gitignored (personal config) and the loader skips
        # files starting with "_", so nothing in the repo is otherwise validated.
        # Check them directly, or the documented examples silently rot out of
        # sync with the schema whenever validation changes.
        run: python tools/validate_examples.py

      - name: Privacy scan
        # Real-looking emails, Slack-style ids and secrets in tracked files.
        # False positives go in tools/privacy_allowlist.txt, never real data.
        run: python tools/privacy_check.py

      - name: Privacy scan of the PR's commits
        # Commit messages and author/committer emails of the PR range.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/privacy_check.py --commits "$BASE_SHA..$HEAD_SHA"

      - name: Inbox version bump
        # A PR that touches workspace_daemon/inbox/ must bump __version__ or
        # add a docs/inbox-changelog.md entry (docs/inbox.md, "Versioning").
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/check_inbox_version.py "$BASE_SHA"

  changes:
    # Decides whether the inbox UI tests must run, and checks that every inbox
    # test module is in a CI job. Always runs: it is cheap.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      inbox: ${{ steps.filter.outputs.inbox }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the PR range needs history

      - name: Every inbox test module is in a CI job
        run: python3 tools/inbox_ui_shards.py --check

      - name: Did the inbox, or anything it imports, change
        id: filter
        # A job-level `if` on this output, not a workflow-level `paths:`: a
        # skipped job still reports, so the `inbox-ui` gate below always
        # reports and could be a required check. The inbox tests import
        # daemon.py and most of workspace_daemon/ (state, config, events,
        # claude_bridge, ...), so that whole tree counts, not only inbox/.
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "inbox=true" >> "$GITHUB_OUTPUT"   # pushes to main: always
            exit 0
          fi
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq \
            '^(workspace_daemon/|daemon\.py$|tests/test_inbox_|tests/inbox_|tools/inbox_ui_shards\.py$|\.github/workflows/)'; then
            echo "inbox=true" >> "$GITHUB_OUTPUT"
          else
            echo "inbox=false" >> "$GITHUB_OUTPUT"
            echo "No inbox-related change: the inbox UI tests are skipped."
          fi

  inbox-ui-shard:
    # The inbox UI is an optional extra: the job above runs without Textual
    # (UI tests skip). This one installs it and runs the UI tests for real,
    # split in 4 shards (module list and balance: tools/inbox_ui_shards.py).
    needs: changes
    if: needs.changes.outputs.inbox == 'true'
    name: inbox-ui shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml 'textual>=8.2,<9' python-bidi

      - name: Inbox tests with Textual
        run: python -m unittest $(python tools/inbox_ui_shards.py --shard ${{ matrix.shard }} --of 4) -v

  inbox-ui:
    # The gate: one stable check name that always reports. Skipped shards
    # (nothing inbox-related changed) count as success; a failed or cancelled
    # shard, or a failed `changes` job, fails it.
    needs: [changes, inbox-ui-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Gate
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.inbox-ui-shard.result }}
        run: |
          echo "changes=$CHANGES shards=$SHARDS"
          [ "$CHANGES" = "success" ] || exit 1
          [ "$SHARDS" = "success" ] || [ "$SHARDS" = "skipped" ] || exit 1
